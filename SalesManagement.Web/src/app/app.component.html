<div class="container">
  <h1>Sales Management</h1>

  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>

  <div class="layout">
    <aside>
      <h2>Districts</h2>

      <ul class="district-list">
        <li *ngFor="let district of districts">
          <button
            type="button"
            (click)="selectDistrict(district)"
            [class.selected]="selectedDistrict?.id === district.id">
            {{ district.name }}
          </button>
        </li>
      </ul>
    </aside>

    <main *ngIf="selectedDistrict">
      <h2>{{ selectedDistrict.name }}</h2>

      <section>
        <h3>Salespeople</h3>

        <table>
          <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let salesperson of selectedDistrict.salespersons">
            <td>{{ salesperson.name }}</td>
            <td>{{ salesperson.role }}</td>
          </tr>
          </tbody>
        </table>
      </section>

      <section>
        <h3>Stores</h3>

        <ul>
          <li *ngFor="let store of selectedDistrict.stores">
            {{ store.name }}
          </li>
        </ul>
      </section>
    </main>
  </div>
</div>
