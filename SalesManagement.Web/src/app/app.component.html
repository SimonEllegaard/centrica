<div class="page">
  <header class="page-header">
    <div>
      <h1>Sales Management</h1>
      <p>Manage districts, salespeople, and stores.</p>
    </div>
  </header>

  <div class="layout">
    <aside class="district-panel">
      <div class="panel-header">
        <h2>Districts</h2>
      </div>
      <ul class="district-list">
        <li *ngFor="let district of districts">
          <button
            type="button"
            class="district-button"
            [class.selected]="selectedDistrict?.id === district.id"
            (click)="selectDistrict(district)">
            {{ district.name }}
          </button>
        </li>
      </ul>
    </aside>

    <main class="content">
      <p *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </p>

      <ng-container *ngIf="selectedDistrict">
        <div class="content-header">
          <div>
            <h2>{{ selectedDistrict.name }}</h2>
            <p>District details</p>
          </div>
        </div>

        <section class="card">
          <div class="card-header">
            <h3>Salespeople</h3>
          </div>

          <table>
            <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
            </tr>
            </thead>

            <tbody>
            <tr *ngFor="let salesperson of selectedDistrict.salespersons">
              <td>{{ salesperson.name }}</td>
              <td>
              <span
                class="role"
                [class.primary]="salesperson.role === 'Primary'"
                [class.secondary]="salesperson.role === 'Secondary'">
                {{ salesperson.role }}
              </span>
              </td>
            </tr>
            </tbody>
          </table>
        </section>

        <section class="card">
          <div class="card-header">
            <h3>Stores</h3>
          </div>

          <ul class="store-list">
            <li *ngFor="let store of selectedDistrict.stores">
              {{ store.name }}
            </li>
          </ul>
        </section>
      </ng-container>
    </main>
  </div>
</div>
